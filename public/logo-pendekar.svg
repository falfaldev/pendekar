<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <filter id="shadow3d" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0c1f6e" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!--
    Canvas: 240 × 240
    Shield sits within horizontal padding ~22px each side (x: 22–218)
    Top of shield: y=18, leaving 18px above (balanced headroom)
    Bottom tip: y=222, leaving ~18px below
  -->

  <!-- GREEN OUTER SHIELD -->
  <path
    d="M120 18
       L218 52
       L218 126
       Q218 176 120 222
       Q22 176 22 126
       L22 52
       Z"
    fill="#18c95a"
    filter="url(#shadow3d)"
  />

  <!-- DARK NAVY RING (10px inset) -->
  <path
    d="M120 29
       L208 61
       L208 126
       Q208 169 120 212
       Q32 169 32 126
       L32 61
       Z"
    fill="#1a3098"
  />

  <!-- BRIGHT BLUE FACE (9px more inset) -->
  <path
    d="M120 41
       L198 71
       L198 126
       Q198 163 120 203
       Q42 163 42 126
       L42 71
       Z"
    fill="#3b5cf5"
  />

  <!--
    CROSS — centred at x=120, vertical centre of blue face:
    Blue face top y=41, bottom y=203 → midpoint = 122.
    Cross arms: width=18px, length=56px.
    Horizontal bar: x[92..148], y[113..131]  → centre y=122 ✓
    Vertical bar:   x[111..129], y[94..150]  → centre y=122 ✓
  -->
  <rect x="92"  y="113" width="56" height="18" rx="5" fill="white"/>
  <rect x="111" y="94"  width="18" height="56" rx="5" fill="white"/>

  <!--
    SMALL HEART — upper-right of cross.
    Heart tip top ≈ y=72, bottom ≈ y=93.
    Centre x ≈ 158.
    Standard heart: two lobes meet at top, V-tip at bottom.
  -->
  <path
    d="M158 93
       C158 93 140 82 140 71
       C140 64 146 60 152 65
       C154 60 156 58 158 58
       C160 58 162 60 164 65
       C170 60 176 64 176 71
       C176 82 158 93 158 93
       Z"
    fill="white"
    opacity="0.95"
  />
</svg>
